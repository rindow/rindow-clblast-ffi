name: tests

on: 
  push:
      branches:
          - main

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.1'
            phpunit: '10.5'
          - os: ubuntu-latest
            php: '8.4'
            phpunit: '11.5'
          - os: ubuntu-latest
            php: '8.5'
            phpunit: '11.5'
          - os: windows-latest
            php: '8.5'
            phpunit: '11.5'
          - os: macos-latest
            php: '8.5'
            phpunit: '11.5'
  
    name: PHP ${{ matrix.php }} for ${{ matrix.os }}
        
    steps:
      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # PHP Extras
          coverage: none
          tools: composer, phpstan
          #ini-values: "memory_limit=512M"
          extensions: ffi, mbstring
        env:
          fail-fast: true

      - name: Checkout codes
        uses: "actions/checkout@v4"

      - name: Composer
        run: |
          composer update
          composer require --dev "phpunit/phpunit=${{ matrix.phpunit }}.*"

      - name: PHP Static Analysys
        run: phpstan

      - name: PHPUnit Tests
        run: vendor/bin/phpunit -c tests --filter ReleaseTest

